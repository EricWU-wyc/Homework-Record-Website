      <div id="homework-form" class="form-box" style="display: none; margin-top: 15px;">
        
        <div id="homework-insert">
          <h3>新增作業</h3>
          <label>指派日期：<input type="date" id="homework-insert-startdate"></label><br><br>
          <label>繳交日期：<input type="date" id="homework-insert-enddate"></label><br><br>
          <label>作業內容：<input id="homework-insert-detail" style="width:30%" placeholder="輸入作業內容"></label><br><br>
          <button id="homework-insert-btn">確認新增</button>
        </div>
        
        <div id="homework-edit">
          <h3>現有作業管理</h3>
          <div>
            <label>
              <select id="homework-filter-field">
                <option value="starttime">指派日期</option>
                <option value="endtime">繳交日期</option>
              </select>
            </label>
            <label>從：<input type="date" id="homework-filter-start"></label>
            <label>到：<input type="date" id="homework-filter-end"></label>
            <button id="load-homework-list-btn">查詢 / 重新載入</button>
          </div>
          <div id="homework-list-container"></div>
        </div>
        
        <script>
          const homeworkInsertBtn = document.getElementById("homework-insert-btn");
          const loadHomeworkBtn = document.getElementById("load-homework-list-btn");
          const homeworkListContainer = document.getElementById("homework-list-container");

          if(homeworkInsertBtn){
            homeworkInsertBtn.addEventListener("click", async() =>{
              const startdate = document.getElementById("homework-insert-startdate").value;
              const enddate = document.getElementById("homework-insert-enddate").value;
              const detail = document.getElementById("homework-insert-detail").value;

              if(!startdate || !enddate || !detail){
                alert("請完整填寫作業資訊!");
                return;
              }

              const {error} = await supabaseClient
                .from("Homework Status")
                .insert([
                  { 
                    starttime: startdate, 
                    endtime: enddate, 
                    details: detail 
                  }
                ]);

              if(error){
                alert("Error: " + error.message);
              } else {
                alert("作業新增成功!");
                document.getElementById("homework-insert-startdate").value = "";
                document.getElementById("homework-insert-enddate").value = "";
                document.getElementById("homework-insert-detail").value = "";
                loadHomeworkList();
              }
            });
          }

          async function loadHomeworkList(){
            if(!homeworkListContainer) return;
            homeworkListContainer.innerHTML = "載入中...";

            const field = document.getElementById("homework-filter-field").value;
            const startDateVal = document.getElementById("homework-filter-start").value;
            const endDateVal = document.getElementById("homework-filter-end").value;

            let query = supabaseClient.from("Homework Status").select("*");

            if(startDateVal){
              query = query.gte(field, startDateVal);
            }
            if(endDateVal){
              query = query.lte(field, endDateVal);
            }

            const {data, error} = await query.order("starttime", {ascending: true});

            if(error){
              homeworkListContainer.innerHTML = "Error：" + error.message;
              return;
            }

            if(!data || data.length === 0){
              homeworkListContainer.innerHTML = "<div>目前沒有符合條件的作業資料</div>";
              return;
            }

            let html = `
              <table border="1" style="width: 80%; border-collapse: collapse; text-align: center; margin-top: 10px;">
                <thead>
                  <tr style="background-color: #f2f2f2;">
                    <th style="padding: 6px;">指派日期</th>
                    <th style="padding: 6px;">繳交日期</th>
                    <th style="padding: 6px;">內容</th>
                    <th style="padding: 6px;">操作</th>
                  </tr>
                </thead>
                <tbody>
            `;

            data.forEach((item) => {
              html += `
                <tr>
                  <td style="padding: 6px;">${item.starttime}</td>
                  <td style="padding: 6px;">${item.endtime}</td>
                  <td style="padding: 6px; text-align: left;">${item.details}</td>
                  <td style="padding: 6px;">
                    <button onclick="editHomework('${item.id}', '${item.starttime}', '${item.endtime}', '${item.details}')">修改</button>
                    <button onclick="deleteHomework('${item.id}')" style="color: red;">刪除</button>
                  </td>
                </tr>
              `;
            });

            html += `</tbody></table>`;
            homeworkListContainer.innerHTML = html;
          }

          window.deleteHomework = async function(id){
            if(!confirm("確定要刪除這筆作業嗎?")) return;

            const {error} = await supabaseClient
              .from("Homework Status")
              .delete()
              .eq("id", id);

            if(error){
              alert("Error：" + error.message);
            } else {
              alert("已成功刪除作業!");
              loadHomeworkList();
            }
          };

          window.editHomework = async function(id, oldStart, oldEnd, oldDetail){
            const newStart = prompt("修改指派日期 (YYYY-MM-DD)：", oldStart);
            if(newStart === null) return;
            const newEnd = prompt("修改繳交日期 (YYYY-MM-DD)：", oldEnd);
            if(newEnd === null) return;
            const newDetail = prompt("修改作業內容：", oldDetail);
            if(newDetail === null) return;

            const {error} = await supabaseClient
              .from("Homework Status")
              .update({starttime: newStart, endtime: newEnd, details: newDetail})
              .eq("id", id);

            if(error){
              alert("Error：" + error.message);
            } else {
              alert("修改成功!");
              loadHomeworkList();
            }
          };

          if(loadHomeworkBtn){
            loadHomeworkBtn.addEventListener("click", loadHomeworkList);
          }
        </script>
      </div>

<div id="note-form" class="form-box" style="display: none; margin-top: 15px;">
        
        <!-- 新增/編輯共用表單區塊 -->
        <div id="note-insert" style="background: #fdfdfd; padding: 15px; border: 1px solid #ddd; margin-bottom: 20px;">
          <h3 id="note-form-title">新增注意事項</h3>
          <!-- 隱藏欄位用來儲存正在編輯的 ID -->
          <input type="hidden" id="note-edit-id">
          
          <label>開始公告日期：<input type="date" id="note-insert-startdate"></label><br><br>
          <label>結束公告日期：<input type="date" id="note-insert-enddate"></label><br><br>
          <label>公告內容：<br><br><textarea id="note-insert-detail" rows="8" style="width: 80%; resize: vertical;" placeholder="輸入注意事項，按下 Enter 即可換行"></textarea></label><br><br>
          
          <button id="note-insert-btn">確認新增</button>
          <button id="note-cancel-edit-btn" style="display: none; background-color: #ccc; margin-left: 10px;">取消修改</button>
        </div>

        <div id="note-edit">
          <h3>現有注意事項管理</h3>
          <div style="margin-bottom: 10px;">
            <label>
              <select id="note-filter-field">
                <option value="starttime">開始公告日期</option>
                <option value="endtime">結束公告日期</option>
              </select>
            </label>
            <label>從：<input type="date" id="note-filter-start"></label>
            <label>到：<input type="date" id="note-filter-end"></label>
            <button id="load-note-list-btn">查詢 / 重新載入</button>
          </div>
          <div id="test-note-container"></div>
        </div>
        
        <script>
          const noteInsertBtn = document.getElementById("note-insert-btn");
          const noteCancelEditBtn = document.getElementById("note-cancel-edit-btn");
          const loadNoteBtn = document.getElementById("load-note-list-btn");
          const noteListContainer = document.getElementById("test-note-container");
          
          const noteFormTitle = document.getElementById("note-form-title");
          const noteEditIdInput = document.getElementById("note-edit-id");
          const noteStartInput = document.getElementById("note-insert-startdate");
          const noteEndInput = document.getElementById("note-insert-enddate");
          const noteDetailInput = document.getElementById("note-insert-detail");

          // 新增或更新按鈕事件
          if(noteInsertBtn){
            noteInsertBtn.addEventListener("click", async() =>{
              const startdate = noteStartInput.value;
              const enddate = noteEndInput.value;
              const detail = noteDetailInput.value;
              const editId = noteEditIdInput.value;

              if(!startdate || !enddate || !detail){
                alert("請完整填寫注意事項資訊!");
                return;
              }

              if(editId) {
                // 執行更新
                const {error} = await supabaseClient
                  .from("Note Status")
                  .update({
                    starttime: startdate,
                    endtime: enddate,
                    details: detail
                  })
                  .eq("id", editId);

                if(error){
                  alert("Error: " + error.message);
                } else {
                  alert("注意事項修改成功!");
                  resetNoteForm();
                  loadNoteList();
                }
              } else {
                // 執行新增
                const {error} = await supabaseClient
                  .from("Note Status")
                  .insert([
                    { 
                      starttime: startdate,
                      endtime: enddate,
                      details: detail
                    }
                  ]);

                if(error){
                  alert("Error: " + error.message);
                } else {
                  alert("注意事項新增成功!");
                  resetNoteForm();
                  loadNoteList();
                }
              }
            });
          }

          // 取消修改按鈕
          if(noteCancelEditBtn){
            noteCancelEditBtn.addEventListener("click", () => {
              resetNoteForm();
            });
          }

          function resetNoteForm() {
            noteEditIdInput.value = "";
            noteStartInput.value = "";
            noteEndInput.value = "";
            noteDetailInput.value = "";
            noteFormTitle.innerText = "新增注意事項";
            noteInsertBtn.innerText = "確認新增";
            noteCancelEditBtn.style.display = "none";
          }

          async function loadNoteList(){
            if(!noteListContainer) return;
            noteListContainer.innerHTML = "載入中...";

            const field = document.getElementById("note-filter-field").value;
            const startDateVal = document.getElementById("note-filter-start").value;
            const endDateVal = document.getElementById("note-filter-end").value;

            let query = supabaseClient.from("Note Status").select("*");

            if(startDateVal){
              query = query.gte(field, startDateVal);
            }
            if(endDateVal){
              query = query.lte(field, endDateVal);
            }

            const {data, error} = await query.order("starttime", {ascending: true});

            if(error){
              noteListContainer.innerHTML = "Error：" + error.message;
              return;
            }

            if(!data || data.length === 0){
              noteListContainer.innerHTML = "<div>目前沒有符合條件的注意事項資料</div>";
              return;
            }

            let html = `
              <table border="1" style="width: 80%; border-collapse: collapse; text-align: center; margin-top: 10px;">
                <thead>
                  <tr style="background-color: #f2f2f2;">
                    <th style="padding: 6px;">開始公告日期</th>
                    <th style="padding: 6px;">結束公告日期</th>
                    <th style="padding: 6px; width: 45%;">公告內容</th>
                    <th style="padding: 6px;">操作</th>
                  </tr>
                </thead>
                <tbody>
            `;

            data.forEach((item) => {
              // 避免內容中的引號破壞 HTML 字串結構
              const safeDetails = item.details.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              html += `
                <tr>
                  <td style="padding: 6px;">${item.starttime}</td>
                  <td style="padding: 6px;">${item.endtime}</td>
                  <td style="padding: 6px; text-align: left; white-space: pre-wrap;">${item.details}</td>
                  <td style="padding: 6px;">
                    <button onclick="prepareEditNote('${item.id}', '${item.starttime}', '${item.endtime}', \`${safeDetails}\`)">修改</button>
                    <button onclick="deleteNote('${item.id}')" style="color: red;">刪除</button>
                  </td>
                </tr>
              `;
            });

            html += `</tbody></table>`;
            noteListContainer.innerHTML = html;
          }

          // 點擊修改後將資料帶入上方的表單
          window.prepareEditNote = function(id, start, end, detail){
            noteEditIdInput.value = id;
            noteStartInput.value = start;
            noteEndInput.value = end;
            noteDetailInput.value = detail;
            
            noteFormTitle.innerText = "修改注意事項";
            noteInsertBtn.innerText = "確認修改";
            noteCancelEditBtn.style.display = "inline-block";

            // 自動將畫面捲動到上方的編輯區塊，方便直接修改
            window.scrollTo({ top: noteFormTitle.offsetTop, behavior: 'smooth' });
          };

          window.deleteNote = async function(id){
            if(!confirm("確定要刪除這筆注意事項嗎?")) return;

            const {error} = await supabaseClient
              .from("Note Status")
              .delete()
              .eq("id", id);

            if(error){
              alert("Error：" + error.message);
            } else {
              alert("已成功刪除注意事項!");
              loadNoteList();
            }
          };

          if(loadNoteBtn){
            loadNoteBtn.addEventListener("click", loadNoteList);
          }
        </script>
      </div>

                    <option value="">當天為例假日</option>
                    <option value="exceptuni">運動服 or 班服</option>
                    <option value="sport">運動服</option>
                    <option value="uniform">制服</option>
                    <option value="class-clothes">班服</option>
                  </select>
                </td>
              </tr>    
              
              <tr>
              <td style="padding: 8px;">星期四</td>
                <td style="padding: 8px;">
                  <select id="thur-clothes-select">
                    <option value="">當天為例假日</option>
                    <option value="exceptuni">運動服 or 班服</option>
                    <option value="sport">運動服</option>
                    <option value="uniform">制服</option>
                    <option value="class-clothes">班服</option>
                  </select>
                </td>
              </tr>    
              
              <tr>
              <td style="padding: 8px;">星期五</td>
                <td style="padding: 8px;">
                  <select id="fri-clothes-select">
                    <option value="">當天為例假日</option>
                    <option value="exceptuni">運動服 or 班服</option>
                    <option value="sport">運動服</option>
                    <option value="uniform">制服</option>

                  </select>

            <button id="clothes-insert-btn">確認修改</button>
            <button id="clothes-origin-btn">預設服裝</button>
          </div>
          <script>
            const clothesInsertBtn = document.getElementById("clothes-insert-btn");

            if(clothesInsertBtn){
              clothesInsertBtn.addEventListener("click", async() =>{
                const clothesmon = document.getElementById("mon-clothes-select").value;
                const clothestue = document.getElementById("tue-clothes-select").value;
                const clotheswed = document.getElementById("wed-clothes-select").value;
                const clothesthur = document.getElementById("thur-clothes-select").value;
                const clothesfri = document.getElementById("fri-clothes-select").value;
                const weekstart = document.getElementById("clothes-weekstart").value;
                const weekend = document.getElementById("clothes-weekend").value;

                const startDateObj = new Date(weekstart);
                if(startDateObj.getDay() !== 1){
                  alert("開始日期必須是星期一！");
                  return;
                }

                const endDateObj = new Date(weekend);
                if(endDateObj.getDay() !== 5){
                  alert("結束日期必須是星期五！");
                  return;
                }

                const diffTime = endDateObj.getTime() - startDateObj.getTime();
                const diffDays = diffTime / (1000 * 60 * 60 * 24);

                if(diffDays < 0){
                  alert("結束日期不能早於開始日期!");
                  return;
                }

                if(diffDays > 4){
                  alert("開始與結束日期必須在同一週內!");
                  return;
                }

                const {data: existingData, error: checkError} = await supabaseClient
                    .from("Clothes Status")
                    .select("*")
                    .eq("weekstart", weekstart);

                if(checkError){
                  alert("Error：" + checkError.message);
                  return;
                }

                let resultError;

                if(existingData && existingData.length > 0){
                  const {error: updateError} = await supabaseClient
                    .from("Clothes Status")
                    .update({ 
                      mon: clothesmon, 
                      tue: clothestue, 
                      wed: clotheswed, 
                      thur: clothesthur, 
                      fri: clothesfri, 
                      weekend: weekend
                    })
                    .eq("weekstart", weekstart);

                  resultError = updateError;
                  if(!resultError){
                    alert("偵測到該週已有紀錄，已自動更新該週服裝！");
                  }
                }else{
                  const {error: insertError} = await supabaseClient
                    .from("Clothes Status")
                    .insert([
                      { 
                        mon: clothesmon, 
                        tue: clothestue, 
                        wed: clotheswed, 
                        thur: clothesthur, 
                        fri: clothesfri, 
                        weekstart: weekstart, 
                        weekend: weekend
                      }
                    ]);

                  resultError = insertError;
                  if(!resultError){
                    alert("服裝設定成功！");
                  }
                }

                if(resultError){
                  alert("Error: " + resultError.message);
                } else {
                  document.getElementById("mon-clothes-select").value = "sport";
                  document.getElementById("tue-clothes-select").value = "sport";
                  document.getElementById("wed-clothes-select").value = "class-clothes";
                  document.getElementById("thur-clothes-select").value = "uniform";
                  document.getElementById("fri-clothes-select").value = "sport";
                  document.getElementById("clothes-weekstart").value = "";
                  document.getElementById("clothes-weekend").value = "";
                }
              });
            }

            const clothesOriginBtn = document.getElementById("clothes-origin-btn");

            if(clothesOriginBtn){
              clothesOriginBtn.addEventListener("click", () => {
                document.getElementById("mon-clothes-select").value = "sport";
                document.getElementById("tue-clothes-select").value = "sport";
                document.getElementById("wed-clothes-select").value = "class-clothes";
                document.getElementById("thur-clothes-select").value = "uniform";
                document.getElementById("fri-clothes-select").value = "sport";

                alert("已自動帶入預設服裝!");
              });
            }
          </script>
      </div>

      <div id="blog-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定 Blog 班級紀錄</h3>
          <div id="blog-insert">
            <h4>新增 Blog</h4>
            <label>標題：<input id="blog-insert-title" style="width:30%" placeholder="輸入標題"></label><br><br>
            <label>上傳日期：<input type="date" id="blog-insert-postdate"></label><br><br>
            <label>公告內容：<br><br><textarea id="blog-insert-detail" rows="8" style="width: 60%; resize: vertical;" placeholder="輸入Blog，按下 Enter 即可換行"></textarea></label><br><br>
            <button id="blog-insert-btn">確認新增</button>
            
          </div>
          <div id="blog-edit">
            <h4>修改 Blog</h4>
          
          </div>
        
          <div id="blog-delete">
            <h4>刪除 Blog</h4>
          
          </div>
        <script>
          const blogInsertBtn = document.getElementById("blog-insert-btn");

          if(blogInsertBtn){
            blogInsertBtn.addEventListener("click", async() =>{

              const blogtitle = document.getElementById("blog-insert-title").value;
              const blogdate = document.getElementById("blog-insert-postdate").value;
              const blogdetail = document.getElementById("blog-insert-detail").value;

              if(!blogtitle || !blogdate || !blogdetail){
                alert("請完整填寫Blog資訊!");
                return;
              }

              const {data, error} = await supabaseClient
                .from("Blog Status")
                .insert([
                  { 
                    title: blogtitle, 
                    postdate: blogdate,
                    blog: blogdetail
                  }
                ]);

              if(error){
                alert("Error: " + error.message);
              }else{
                alert("Blog新增成功!");

                document.getElementById("blog-insert-title").value = "";
                document.getElementById("blog-insert-postdate").value = "";
                document.getElementById("blog-insert-detail").value = "";
              }
            });
          }
        </script>
      </div>
    </div>
    
  
    <script>
      const loginBtn = document.getElementById("login-btn");
      const passwordBlank = document.getElementById("password-blank");
      const statusSelect = document.getElementById("status-select");

      async function handleLogin(){
        const inputPwd = passwordBlank.value;

        const {data, error} = await supabaseClient
          .from("Manager's Password")
          .select("*")
          .eq("password", inputPwd);

        if(error){
          alert("System: " + error.message);
          return;
        }

        if(data && data.length > 0){
          alert("登入成功");
          document.getElementById("login-container").style.display = "none";
          document.getElementById("admin-container").style.display = "block";
        }else{
          alert("密碼錯誤");
        }
      }

      loginBtn.addEventListener("click", handleLogin);
      
      passwordBlank.addEventListener("keydown", (event) => {
        if(event.key === "Enter"){
          loginBtn.click();
        }
      });

      statusSelect.addEventListener("change", (event) => {
        const selectedValue = event.target.value;

        const allForms = document.querySelectorAll(".form-box");
        allForms.forEach((box) => {
          box.style.display = "none";
        });

        if(selectedValue){
          const targetForm = document.getElementById(selectedValue + "-form");
          if(targetForm){
            targetForm.style.display = "block";
          }
        }
      });
    </script>
    
  </body>
