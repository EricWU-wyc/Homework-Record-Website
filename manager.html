<!DOCTYPE html>
<html lang="zh-Hant">
  
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://ocwpamhemxddhujichkz.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jd3BhbWhlbXhkZGh1amljaGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTYzNzUsImV4cCI6MjEwNDQ3MjM3NX0.N4N75_Y7dFNoOiSEBvKEcpHHMdxFfGC0P4PDmlNbTns";
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <title>FDHS 407 線上聯絡簿 後臺管理</title>
  </head>
  
  <body>
    <div id="login-container">
      <h1>407 線上聯絡簿 後臺登入</h1>
      <p>請輸入後臺管理密碼</p>
      <input type="password" placeholder="password" id="password-blank">
      <button id="login-btn">登入</button>
    </div>
    
    <div id="homeword-form" style="display: none;">
      
    </div>
    
    <div id="test-form" style="display: none;"></div>
    
    <div id="note-form" style="display: none;"></div>
    
    <div id="failure-form" style="display: none;"></div>
    
    <div id="present-form" style="display: none;"></div>
    
    <div id="clothes-form" style="display: none;"></div>
    
    <div id="blog-form" style="display: none;"></div>
    
    
    <div id="admin-container" style="display: none;">
      <h1>407 線上聯絡簿 後臺管理系統</h1>
      
      <label for="status-select">選擇要更新的內容：</label>
      <select id="status-select">
        <option value="homeword">作業</option>
        <option value="test">考試</option>
        <option value="note">注意事項</option>
        <option value="failure">缺交名單</option>
        <option value="present">出缺席</option>
        <option value="clothes">服裝</option>
        <option value="blog">Blog 班級紀錄</option>
      </select>
    </div>
    
    <script>
    document.getElementById("login-btn").addEventListener("click", async() =>{
        const inputPwd = document.getElementById("password-blank").value;

        const {data, error} = await supabaseClient
          .from("Manager's Password")
          .select("*")
          .eq("password", inputPwd);

        if(error){
          alert("System: " + error.message);
          return;
        }

        if(data && data.length > 0){
          alert("登入成功");
          document.getElementById("login-container").style.display = "none";
          document.getElementById("admin-container").style.display = "block";
        }else{
          alert("密碼錯誤");
        }
    });
      
    document.getElementById("password-blank").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        document.getElementById("login-btn").click();
      }
    });
    </script>
    
  </body>
</html>
