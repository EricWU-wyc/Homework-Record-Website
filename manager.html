<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://ocwpamhemxddhujichkz.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jd3BhbWhlbXhkZGh1amljaGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4OTYzNzUsImV4cCI6MjEwNDQ3MjM3NX0.N4N75_Y7dFNoOiSEBvKEcpHHMdxFfGC0P4PDmlNbTns";
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    <title>FDHS 407 線上聯絡簿 後臺管理</title>
  </head>
  
  <body>
    
    <div id="login-container">
      <h1>407 線上聯絡簿 後臺登入</h1>
      <p>請輸入後臺管理密碼</p>
      <input type="password" placeholder="password" id="password-blank">
      <button id="login-btn">登入</button>
    </div>
    
    <div id="admin-container" style="display: none;">
      <h1>407 線上聯絡簿 後臺管理系統</h1>
      
      <label for="status-select">選擇要更新的內容：</label>
      <select id="status-select">
        <option value="">-- 請選擇項目 --</option>
        <option value="homework">作業</option>
        <option value="test">考試</option>
        <option value="note">注意事項</option>
        <option value="failure">缺交名單</option>
        <option value="clothes">服裝</option>
        <option value="blog">Blog 班級紀錄</option>
      </select>

      <div id="homework-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定作業</h3>
        
        <div id="homework-insert">
          <h4>新增作業</h4>
          <label>指派日期：<input type="date" id="homework-insert-startdate"></label><br><br>
          <label>檢查/繳交日期：<input type="date" id="homework-insert-enddate"></label><br><br>
          <label>作業內容：<input id="homework-insert-detail" style="width:30%" placeholder="輸入作業內容"></label><br><br>
          <button id="homework-insert-btn">確認新增</button>
        </div>
        
        <div id="homework-edit">
          <h4>修改作業</h4>

        </div>
        
        <div id="homework-delete">
          <h4>刪除作業</h4>
          
        </div>
        
      </div>

      <div id="test-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定考試</h3>
        
        <div id="test-insert">
          <h4>新增考試</h4>
          <label>指派日期：<input type="date" id="test-insert-startdate"></label><br><br>
          <label>考試日期：<input type="date" id="test-insert-enddate"></label><br><br>
          <label>考試內容：<input id="test-insert-detail" style="width:30%" placeholder="輸入考試內容"></label><br><br>
          <button id="test-insert-btn">確認新增</button>
        </div>

        <div id="test-edit">
          <h4>修改考試</h4>

        </div>        

        <div id="test-delete">
          <h4>刪除考試</h4>
          
        </div>
      </div>
        

      <div id="note-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定注意事項</h3>
        
        <div id="note-insert">
          <h4>新增注意事項</h4>
          <label>開始公告日期：<input type="date" id="note-insert-startdate"></label><br><br>
          <label>結束公告日期：<input type="date" id="note-insert-enddate"></label><br><br>
          <label>公告內容：<br><br><textarea id="note-insert-detail" rows="6" style="width: 80%; resize: vertical;" placeholder="輸入注意事項，按下 Enter 即可換行"></textarea></label><br><br>
          <button id="note-insert-btn">確認新增</button>
        </div>
        
        <div id="note-delete">
          <h4>刪除注意事項</h4>
          
        </div>
      </div>

      <div id="failure-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定缺繳名單</h3>
        <p>缺交名單相關欄位建置中...</p>
      </div>

      <div id="clothes-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定本週服裝</h3>
        <p>服裝相關欄位建置中...</p>
      </div>

      <div id="blog-form" class="form-box" style="display: none; margin-top: 15px;">
        <h3>設定 Blog 班級紀錄</h3>
        <p>Blog 相關欄位建置中...</p>
      </div>
    </div>
    
    <script>
      const loginBtn = document.getElementById("login-btn");
      const passwordBlank = document.getElementById("password-blank");
      const statusSelect = document.getElementById("status-select");

      async function handleLogin() {
        const inputPwd = passwordBlank.value;

        const {data, error} = await supabaseClient
          .from("Manager's Password")
          .select("*")
          .eq("password", inputPwd);

        if(error){
          alert("System: " + error.message);
          return;
        }

        if(data && data.length > 0){
          alert("登入成功");
          document.getElementById("login-container").style.display = "none";
          document.getElementById("admin-container").style.display = "block";
        }else{
          alert("密碼錯誤");
        }
      }

      loginBtn.addEventListener("click", handleLogin);
      
      passwordBlank.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          loginBtn.click();
        }
      });

      statusSelect.addEventListener("change", (event) => {
        const selectedValue = event.target.value;

        const allForms = document.querySelectorAll(".form-box");
        allForms.forEach((box) => {
          box.style.display = "none";
        });

        if (selectedValue) {
          const targetForm = document.getElementById(selectedValue + "-form");
          if (targetForm) {
            targetForm.style.display = "block";
          }
        }
      });
    </script>
    
  </body>
</html>
