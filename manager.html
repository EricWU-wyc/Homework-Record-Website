      <div id="homework-form" class="form-box" style="display: none; margin-top: 15px;">
        <div id="homework-insert">
          <h3 id="homework-form-title">新增作業</h3>
          <input type="hidden" id="homework-edit-id">
          
          <label>指派日期：<input type="date" id="homework-insert-startdate"></label><br><br>
          <label>繳交日期：<input type="date" id="homework-insert-enddate"></label><br><br>
          <label>作業內容：<input id="homework-insert-detail" style="width:30%" placeholder="輸入作業內容"></label><br><br>
          
          <button id="homework-insert-btn">確認新增</button>
          <button id="homework-cancel-edit-btn" style="display: none; margin-left: 10px;">取消修改</button>
        </div>
        
        <div id="homework-edit">
          <h3>現有作業管理</h3>
          <div>
            <label>
              <select id="homework-filter-field">
                <option value="starttime">指派日期</option>
                <option value="endtime">繳交日期</option>
              </select>
            </label>
            <label>從：<input type="date" id="homework-filter-start"></label>
            <label>到：<input type="date" id="homework-filter-end"></label>
            <button id="load-homework-list-btn">查詢 / 重新載入</button>
          </div>
          <div id="homework-list-container"></div>
        </div>
        
        <script>
          const homeworkInsertBtn = document.getElementById("homework-insert-btn");
          const homeworkCancelEditBtn = document.getElementById("homework-cancel-edit-btn");
          const loadHomeworkBtn = document.getElementById("load-homework-list-btn");
          const homeworkListContainer = document.getElementById("homework-list-container");

          const homeworkFormTitle = document.getElementById("homework-form-title");
          const homeworkEditIdInput = document.getElementById("homework-edit-id");
          const homeworkStartInput = document.getElementById("homework-insert-startdate");
          const homeworkEndInput = document.getElementById("homework-insert-enddate");
          const homeworkDetailInput = document.getElementById("homework-insert-detail");

          if(homeworkInsertBtn){
            homeworkInsertBtn.addEventListener("click", async() =>{
              const startdate = homeworkStartInput.value;
              const enddate = homeworkEndInput.value;
              const detail = homeworkDetailInput.value;
              const editId = homeworkEditIdInput.value;

              if(!startdate || !enddate || !detail){
                alert("請完整填寫作業資訊!");
                return;
              }

              if(editId){
                const {error} = await supabaseClient
                  .from("Homework Status")
                  .update({starttime: startdate, endtime: enddate, details: detail })
                  .eq("id", editId);

                if(error){
                  alert("Error: " + error.message);
                }else{
                  alert("作業修改成功!");
                  resetHomeworkForm();
                  loadHomeworkList();
                }
              }else{
                const {error} = await supabaseClient
                  .from("Homework Status")
                  .insert([{starttime: startdate, endtime: enddate, details: detail }]);

                if(error){
                  alert("Error: " + error.message);
                }else{
                  alert("作業新增成功!");
                  resetHomeworkForm();
                  loadHomeworkList();
                }
              }
            });
          }

          if(homeworkCancelEditBtn){
            homeworkCancelEditBtn.addEventListener("click", () =>{
              resetHomeworkForm();
            });
          }

          function resetHomeworkForm(){
            homeworkEditIdInput.value = "";
            homeworkStartInput.value = "";
            homeworkEndInput.value = "";
            homeworkDetailInput.value = "";
            homeworkFormTitle.innerText = "新增作業";
            homeworkInsertBtn.innerText = "確認新增";
            homeworkCancelEditBtn.style.display = "none";
          }

          async function loadHomeworkList(){
            if(!homeworkListContainer) return;
            homeworkListContainer.innerHTML = "載入中...";

            const field = document.getElementById("homework-filter-field").value;
            const startDateVal = document.getElementById("homework-filter-start").value;
            const endDateVal = document.getElementById("homework-filter-end").value;

            let query = supabaseClient.from("Homework Status").select("*");

            if(startDateVal){
              query = query.gte(field, startDateVal);
            }
            if(endDateVal){
              query = query.lte(field, endDateVal);
            }

            const {data, error} = await query.order("starttime", {ascending: true});

            if(error){
              homeworkListContainer.innerHTML = "Error：" + error.message;
              return;
            }

            if(!data || data.length === 0){
              homeworkListContainer.innerHTML = "<div>目前沒有符合條件的作業資料</div>";
              return;
            }

            let html = `
              <table border="1" style="width: 80%; border-collapse: collapse; text-align: center; margin-top: 10px;">
                <thead>
                  <tr>
                    <th style="padding: 6px;">指派日期</th>
                    <th style="padding: 6px;">繳交日期</th>
                    <th style="padding: 6px;">內容</th>
                    <th style="padding: 6px;">操作</th>
                  </tr>
                </thead>
                <tbody>
            `;

            data.forEach((item) =>{
              const safeDetails = item.details.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              html += `
                <tr>
                  <td style="padding: 6px;">${item.starttime}</td>
                  <td style="padding: 6px;">${item.endtime}</td>
                  <td style="padding: 6px; text-align: left;">${item.details}</td>
                  <td style="padding: 6px;">
                    <button onclick="prepareEditHomework('${item.id}', '${item.starttime}', '${item.endtime}', \`${safeDetails}\`)">修改</button>
                    <button onclick="deleteHomework('${item.id}')" style="color: red;">刪除</button>
                  </td>
                </tr>
              `;
            });

            html += `</tbody></table>`;
            homeworkListContainer.innerHTML = html;
          }

          window.prepareEditHomework = function(id, start, end, detail){
            homeworkEditIdInput.value = id;
            homeworkStartInput.value = start;
            homeworkEndInput.value = end;
            homeworkDetailInput.value = detail;
            
            homeworkFormTitle.innerText = "修改作業";
            homeworkInsertBtn.innerText = "確認修改";
            homeworkCancelEditBtn.style.display = "inline-block";

            window.scrollTo({top: homeworkFormTitle.offsetTop, behavior: 'smooth' });
          };

          window.deleteHomework = async function(id){
            if(!confirm("確定要刪除這筆作業嗎?")) return;

            const {error} = await supabaseClient
              .from("Homework Status")
              .delete()
              .eq("id", id);

            if(error){
              alert("Error：" + error.message);
            }else{
              alert("已成功刪除作業!");
              loadHomeworkList();
            }
          };

          if(loadHomeworkBtn){
            loadHomeworkBtn.addEventListener("click", loadHomeworkList);
          }
        </script>

          <script>
            const clothesInsertBtn = document.getElementById("clothes-insert-btn");

            if(clothesInsertBtn){
              clothesInsertBtn.addEventListener("click", async() =>{
                const clothesmon = document.getElementById("mon-clothes-select").value;
                const clothestue = document.getElementById("tue-clothes-select").value;
                const clotheswed = document.getElementById("wed-clothes-select").value;
                const clothesthur = document.getElementById("thur-clothes-select").value;
                const clothesfri = document.getElementById("fri-clothes-select").value;
                const weekstart = document.getElementById("clothes-weekstart").value;
                const weekend = document.getElementById("clothes-weekend").value;

                const startDateObj = new Date(weekstart);
                if(startDateObj.getDay() !== 1){
                  alert("開始日期必須是星期一！");
                  return;
                }

                const endDateObj = new Date(weekend);
                if(endDateObj.getDay() !== 5){
                  alert("結束日期必須是星期五！");
                  return;
                }

                const diffTime = endDateObj.getTime() - startDateObj.getTime();
                const diffDays = diffTime / (1000 * 60 * 60 * 24);

                if(diffDays < 0){
                  alert("結束日期不能早於開始日期!");
                  return;
                }

                if(diffDays > 4){
                  alert("開始與結束日期必須在同一週內!");
                  return;
                }

                const {data: existingData, error: checkError} = await supabaseClient
                    .from("Clothes Status")
                    .select("*")
                    .eq("weekstart", weekstart);

                if(checkError){
                  alert("Error：" + checkError.message);
                  return;
                }

                let resultError;

                if(existingData && existingData.length > 0){
                  const {error: updateError} = await supabaseClient
                    .from("Clothes Status")
                    .update({
                      mon: clothesmon, 
                      tue: clothestue, 
                      wed: clotheswed, 
                      thur: clothesthur, 
                      fri: clothesfri, 
                      weekend: weekend
                    })
                    .eq("weekstart", weekstart);

                  resultError = updateError;
                  if(!resultError){
                    alert("偵測到該週已有紀錄，已自動更新該週服裝！");
                  }
                }else{
                  const {error: insertError} = await supabaseClient
                    .from("Clothes Status")
                    .insert([
                      {
                        mon: clothesmon, 
                        tue: clothestue, 
                        wed: clotheswed, 
                        thur: clothesthur, 
                        fri: clothesfri, 
                        weekstart: weekstart, 
                        weekend: weekend
                      }
                    ]);

                  resultError = insertError;
                  if(!resultError){
                    alert("服裝設定成功！");
                  }
                }

                if(resultError){
                  alert("Error: " + resultError.message);
                }else{
                  document.getElementById("mon-clothes-select").value = "sport";
                  document.getElementById("tue-clothes-select").value = "sport";
                  document.getElementById("wed-clothes-select").value = "class-clothes";
                  document.getElementById("thur-clothes-select").value = "uniform";
                  document.getElementById("fri-clothes-select").value = "sport";
                  document.getElementById("clothes-weekstart").value = "";
                  document.getElementById("clothes-weekend").value = "";
                }
              });
            }

            const clothesOriginBtn = document.getElementById("clothes-origin-btn");

            if(clothesOriginBtn){
              clothesOriginBtn.addEventListener("click", () =>{
                document.getElementById("mon-clothes-select").value = "sport";
                document.getElementById("tue-clothes-select").value = "sport";
                document.getElementById("wed-clothes-select").value = "class-clothes";
                document.getElementById("thur-clothes-select").value = "uniform";
                document.getElementById("fri-clothes-select").value = "sport";

                alert("已自動帶入預設服裝!");
              });
            }
          </script>

          <label>公告內容：<br><br><textarea id="blog-insert-detail" rows="8" style="width: 60%; resize: vertical;" placeholder="輸入Blog，按下 Enter 即可換行"></textarea></label><br><br>
          
          <button id="blog-insert-btn">確認新增</button>
          <button id="blog-cancel-edit-btn" style="display: none; margin-left: 10px;">取消修改</button>

        <div id="blog-edit">
          <h3>現有 Blog 管理</h3>
          <div style="margin-bottom: 10px;">
            <button id="load-blog-list-btn">重新載入</button>
          </div>
          <div id="blog-list-container"></div>
        </div>
        
        <script>
          const blogInsertBtn = document.getElementById("blog-insert-btn");
          const blogCancelEditBtn = document.getElementById("blog-cancel-edit-btn");
          const loadBlogBtn = document.getElementById("load-blog-list-btn");
          const blogListContainer = document.getElementById("blog-list-container");

          const blogFormTitle = document.getElementById("blog-form-title");
          const blogEditIdInput = document.getElementById("blog-edit-id");
          const blogTitleInput = document.getElementById("blog-insert-title");
          const blogDateInput = document.getElementById("blog-insert-postdate");
          const blogDetailInput = document.getElementById("blog-insert-detail");

          if(blogInsertBtn){
            blogInsertBtn.addEventListener("click", async() =>{
              const blogtitle = blogTitleInput.value;
              const blogdate = blogDateInput.value;
              const blogdetail = blogDetailInput.value;
              const editId = blogEditIdInput.value;

              if(!blogtitle || !blogdate || !blogdetail){
                alert("請完整填寫Blog資訊!");
                return;
              }

              if(editId){
                const {error} = await supabaseClient
                  .from("Blog Status")
                  .update({title: blogtitle, postdate: blogdate, blog: blogdetail })
                  .eq("id", editId);

                if(error){
                  alert("Error: " + error.message);
                }else{
                  alert("Blog修改成功!");
                  resetBlogForm();
                  loadBlogList();
                }
              }else{
                const {error} = await supabaseClient
                  .from("Blog Status")
                  .insert([{title: blogtitle, postdate: blogdate, blog: blogdetail }]);

                if(error){
                  alert("Error: " + error.message);
                }else{
                  alert("Blog新增成功!");
                  resetBlogForm();
                  loadBlogList();
                }
              }
            });
          }

          if(blogCancelEditBtn){
            blogCancelEditBtn.addEventListener("click", () =>{
              resetBlogForm();
            });
          }

          function resetBlogForm(){
            blogEditIdInput.value = "";
            blogTitleInput.value = "";
            blogDateInput.value = "";
            blogDetailInput.value = "";
            blogFormTitle.innerText = "新增 Blog";
            blogInsertBtn.innerText = "確認新增";
            blogCancelEditBtn.style.display = "none";
          }

          async function loadBlogList(){
            if(!blogListContainer) return;
            blogListContainer.innerHTML = "載入中...";

            const {data, error} = await supabaseClient.from("Blog Status").select("*").order("postdate", {ascending: true});

            if(error){
              blogListContainer.innerHTML = "Error：" + error.message;
              return;
            }

            if(!data || data.length === 0){
              blogListContainer.innerHTML = "<div>目前沒有 Blog 資料</div>";
              return;
            }

            let html = `
              <table border="1" style="width: 80%; border-collapse: collapse; text-align: center; margin-top: 10px;">
                <thead>
                  <tr>
                    <th style="padding: 6px;">標題</th>
                    <th style="padding: 6px;">上傳日期</th>
                    <th style="padding: 6px; width: 45%;">內容</th>
                    <th style="padding: 6px;">操作</th>
                  </tr>
                </thead>
                <tbody>
            `;

            data.forEach((item) =>{
              const safeTitle = item.title.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              const safeBlog = item.blog.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
              html += `
                <tr>
                  <td style="padding: 6px; text-align: left;">${item.title}</td>
                  <td style="padding: 6px;">${item.postdate}</td>
                  <td style="padding: 6px; text-align: left; white-space: pre-wrap;">${item.blog}</td>
                  <td style="padding: 6px;">
                    <button onclick="prepareEditBlog('${item.id}', \`${safeTitle}\`, '${item.postdate}', \`${safeBlog}\`)">修改</button>
                    <button onclick="deleteBlog('${item.id}')" style="color: red;">刪除</button>
                  </td>
                </tr>
              `;
            });

            html += `</tbody></table>`;
            blogListContainer.innerHTML = html;
          }

          window.prepareEditBlog = function(id, title, date, blog){
            blogEditIdInput.value = id;
            blogTitleInput.value = title;
            blogDateInput.value = date;
            blogDetailInput.value = blog;
            
            blogFormTitle.innerText = "修改 Blog";
            blogInsertBtn.innerText = "確認修改";
            blogCancelEditBtn.style.display = "inline-block";

            window.scrollTo({top: blogFormTitle.offsetTop, behavior: 'smooth'});
          };

          window.deleteBlog = async function(id){
            if(!confirm("確定要刪除這筆 Blog 嗎?")) return;

            const {error} = await supabaseClient
              .from("Blog Status")
              .delete()
              .eq("id", id);

            if(error){
              alert("Error：" + error.message);
            }else{
              alert("已成功刪除 Blog!");
              loadBlogList();
            }
          };

          if(loadBlogBtn){
            loadBlogBtn.addEventListener("click", loadBlogList);
          }
        </script>
      </div>

    <script>
      const loginBtn = document.getElementById("login-btn");
      const passwordBlank = document.getElementById("password-blank");
      const statusSelect = document.getElementById("status-select");

      async function handleLogin(){
        const inputPwd = passwordBlank.value;

        const {data, error} = await supabaseClient
          .from("Manager's Password")
          .select("*")
          .eq("password", inputPwd);

        if(error){
          alert("System: " + error.message);
          return;
        }

        if(data && data.length > 0){
          alert("登入成功");
          document.getElementById("login-container").style.display = "none";
          document.getElementById("admin-container").style.display = "block";
        }else{
          alert("密碼錯誤");
        }
      }

      loginBtn.addEventListener("click", handleLogin);
      
      passwordBlank.addEventListener("keydown", (event) =>{
        if(event.key === "Enter"){
          loginBtn.click();
        }
      });

      statusSelect.addEventListener("change", (event) =>{
        const selectedValue = event.target.value;

        const allForms = document.querySelectorAll(".form-box");
        allForms.forEach((box) =>{
          box.style.display = "none";
        });

        if(selectedValue){
          const targetForm = document.getElementById(selectedValue + "-form");
          if(targetForm){
            targetForm.style.display = "block";
            // 切換選項時自動載入對應清單
            if(selectedValue === "homework" && typeof loadHomeworkList === "function") loadHomeworkList();
            if(selectedValue === "test" && typeof loadTestList === "function") loadTestList();
            if(selectedValue === "note" && typeof loadNoteList === "function") loadNoteList();
            if(selectedValue === "failure" && typeof loadFailureList === "function") loadFailureList();
            if(selectedValue === "blog" && typeof loadBlogList === "function") loadBlogList();
          }
        }
      });
    </script>
